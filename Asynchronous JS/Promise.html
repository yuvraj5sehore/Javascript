    function addStuffing(data){
    return new Promise (function (resolve,reject){
        setTimeout(function(){
            if(data){
                resolve("stuffing added");
            }else{
                reject("Reject of cutted the bread");
            }
        },2000);
    });
   }

   function bake(data){
    return new Promise (function (resolve,reject){
        setTimeout(function(){
            if(data){
                resolve("Sandwich");
            }else{
                reject("Reject of cutted the bread");
            }
        },2000);
    });
   }

   function cutTheBread(raw){
    return new Promise (function (resolve,reject){
        setTimeout(function(){
            if(raw){
                resolve("cutted Bread");
            }else{
                reject("Reject of cutted the bread");
            }
        },2000);
    });
   }
